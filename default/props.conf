#
# props.conf - Search-time field extractions and normalizations
# TA-gen_ai_cim
#
# This configuration applies search-time normalization to GenAI telemetry.
# Normalizes provider-specific fields into the unified gen_ai.* namespace based on OTel semantic conventions.
#
# IMPORTANT: This TA provides SEARCH-TIME extractions only.
# Index-time settings (INDEXED_EXTRACTIONS, TIMESTAMP_FIELDS, LINE_BREAKER, TRUNCATE, etc.)
# should be configured in the inputs/props on the indexers or Heavy Forwarders, not here.
#
# IMPORTANT: props.conf has NO index:: scope. Per props.conf.spec, a stanza [<spec>]
# may only be <sourcetype>, host::<host>, source::<source>, rule::<rulename>, or
# delayedrule::<rulename>. A stanza such as [index::gen_ai_log] is parsed as a literal
# SOURCETYPE NAME and therefore never matches any event. Normalization is keyed on the
# canonical sourcetype gen_ai:json below; attach other ingest sourcetypes to it with
# "rename = gen_ai:json".
#
# Compatible with: Splunk Enterprise 9.0+, Splunk Cloud
#

###############################################################################
# CANONICAL INGEST SOURCETYPE (Primary - all GenAI telemetry should land here)
#
# Send flat, OTel-shaped JSON governance events to index=gen_ai_log with
# sourcetype=gen_ai:json (HEC, or the OpenTelemetry Collector splunk_hec
# exporter). See README.md -> "Configure Data Inputs".
###############################################################################

[gen_ai:json]
# Search-time JSON field extraction
KV_MODE = json

#-----------------------------------------------------------------------------
# Core Operation & Model Identity
#-----------------------------------------------------------------------------
FIELDALIAS-genai_operation_name = operation_name AS gen_ai.operation.name
FIELDALIAS-genai_provider_name = provider_name AS gen_ai.provider.name
FIELDALIAS-genai_request_model = request_model AS gen_ai.request.model
FIELDALIAS-genai_response_model = response_model AS gen_ai.response.model
FIELDALIAS-genai_response_id = response_id AS gen_ai.response.id
FIELDALIAS-genai_conversation_id = conversation_id AS gen_ai.conversation.id
FIELDALIAS-genai_deployment_id = deployment_id AS gen_ai.deployment.id
FIELDALIAS-genai_request_id = request_id AS gen_ai.request.id
FIELDALIAS-genai_session_id = session_id AS gen_ai.session.id
FIELDALIAS-genai_event_id = event_id AS gen_ai.event.id
FIELDALIAS-genai_trace_id = trace_id AS trace_id

#-----------------------------------------------------------------------------
# Input/Output Payload
#-----------------------------------------------------------------------------
FIELDALIAS-genai_system_instructions = system_instructions AS gen_ai.system_instructions
FIELDALIAS-genai_output_type = output_type AS gen_ai.output.type
FIELDALIAS-genai_input_raw = input_messages AS gen_ai.input.messages_raw
FIELDALIAS-genai_output_raw = output_messages AS gen_ai.output.messages_raw

# Extract text content from JSON array messages
# Handles three formats:
#   1. Array of objects with content key: [{"content": "text"}]
#   2. Array of strings: ["text"]
#   3. Simple string: "text"
EVAL-gen_ai.input.messages = case( \
    isnotnull('input_messages{}.content'), mvjoin('input_messages{}.content', " "), \
    isnotnull('input_messages{}'), mvjoin('input_messages{}', " "), \
    isnotnull(input_messages), input_messages, \
    1=1, null())
EVAL-gen_ai.output.messages = case( \
    isnotnull('output_messages{}.content'), mvjoin('output_messages{}.content', " "), \
    isnotnull('output_messages{}'), mvjoin('output_messages{}', " "), \
    isnotnull(output_messages), output_messages, \
    1=1, null())

#-----------------------------------------------------------------------------
# Request Parameters
#-----------------------------------------------------------------------------
FIELDALIAS-genai_token_type = token_type AS gen_ai.token.type
FIELDALIAS-genai_max_tokens = request_max_tokens AS gen_ai.request.max_tokens
FIELDALIAS-genai_temperature = request_temperature AS gen_ai.request.temperature
FIELDALIAS-genai_top_p = request_top_p AS gen_ai.request.top_p
FIELDALIAS-genai_frequency_penalty = request_frequency_penalty AS gen_ai.request.frequency_penalty
FIELDALIAS-genai_presence_penalty = request_presence_penalty AS gen_ai.request.presence_penalty

# JSON arrays -> multi-value. See the multi-value note in the "Safety,
# Guardrails, Policy" section below for why these are EVAL and why they must
# read the braced field name.
EVAL-gen_ai.request.stop_sequences = case( \
    isnotnull('request_stop_sequences{}'), 'request_stop_sequences{}', \
    isnotnull(request_stop_sequences), request_stop_sequences, \
    1=1, null())
EVAL-gen_ai.response.finish_reasons = case( \
    isnotnull('response_finish_reasons{}'), 'response_finish_reasons{}', \
    isnotnull(response_finish_reasons), response_finish_reasons, \
    1=1, null())
FIELDALIAS-genai_choice_count = request_choice_count AS gen_ai.request.choice.count
FIELDALIAS-genai_seed = request_seed AS gen_ai.request.seed

#-----------------------------------------------------------------------------
# Usage, Performance, Cost
#-----------------------------------------------------------------------------
FIELDALIAS-genai_input_tokens = usage_input_tokens AS gen_ai.usage.input_tokens
FIELDALIAS-genai_output_tokens = usage_output_tokens AS gen_ai.usage.output_tokens
FIELDALIAS-genai_duration = client_operation_duration AS gen_ai.client.operation.duration
FIELDALIAS-genai_cost = cost AS gen_ai.cost.total

# Computed: total tokens = input + output
EVAL-gen_ai.usage.total_tokens = coalesce(usage_input_tokens, 0) + coalesce(usage_output_tokens, 0)

#-----------------------------------------------------------------------------
# Safety, Guardrails, Policy
#
# Two-step pattern: alias the raw source field to a *_raw name, then compute the
# canonical field from the underscore source. This avoids an EVAL that reads and
# rewrites the same field name it is defined as.
#-----------------------------------------------------------------------------
FIELDALIAS-genai_safety_violated_raw = safety_violated AS gen_ai.safety.violated_raw
FIELDALIAS-genai_guardrail_triggered_raw = guardrail_triggered AS gen_ai.guardrail.triggered_raw
FIELDALIAS-genai_pii_detected_raw = pii_detected AS gen_ai.pii.detected_raw
FIELDALIAS-genai_policy_blocked_raw = policy_blocked AS gen_ai.policy.blocked_raw

# Multi-value array fields.
#
# Emitters send these as JSON arrays, and KV_MODE = json auto-extracts a JSON
# array as the BRACED multi-value field name ("safety_categories{}"), not the
# bare name. A FIELDALIAS or a transforms SOURCE_KEY that targets the bare name
# therefore never matches and the CIM field stays null - that was the case for
# all five of these fields until v1.6.2, which silently disabled the
# gen_ai.safety.categories branch of the prompt-injection correlation rule.
#
# Same reasoning as gen_ai.escalation.* further down: EVAL, not FIELDALIAS,
# because multi-value behaviour through a field alias is undocumented and this
# TA ships to Splunk 9.0+ / Splunk Cloud. An eval assignment preserves
# multi-value by definition. The braced form is tried first, then the bare name
# so a scalar-string emitter still normalizes. Do not "simplify" these back
# into FIELDALIAS, and do not drop the braced branch.
EVAL-gen_ai.safety.categories = case( \
    isnotnull('safety_categories{}'), 'safety_categories{}', \
    isnotnull(safety_categories), safety_categories, \
    1=1, null())
EVAL-gen_ai.guardrail.ids = case( \
    isnotnull('guardrail_ids{}'), 'guardrail_ids{}', \
    isnotnull(guardrail_ids), guardrail_ids, \
    1=1, null())
EVAL-gen_ai.pii.types = case( \
    isnotnull('pii_types{}'), 'pii_types{}', \
    isnotnull(pii_types), pii_types, \
    1=1, null())

# Normalize booleans to consistent "true"/"false" strings
EVAL-gen_ai.safety.violated = case( \
    safety_violated=="true" OR safety_violated==1, "true", \
    safety_violated=="false" OR safety_violated==0, "false", \
    isnotnull(safety_violated), lower(safety_violated), \
    1=1, null())
EVAL-gen_ai.guardrail.triggered = case( \
    guardrail_triggered=="true" OR guardrail_triggered==1, "true", \
    guardrail_triggered=="false" OR guardrail_triggered==0, "false", \
    isnotnull(guardrail_triggered), lower(guardrail_triggered), \
    1=1, null())
EVAL-gen_ai.pii.detected = case( \
    pii_detected=="true" OR pii_detected==1, "true", \
    pii_detected=="false" OR pii_detected==0, "false", \
    isnotnull(pii_detected), lower(pii_detected), \
    1=1, null())
EVAL-gen_ai.policy.blocked = case( \
    policy_blocked=="true" OR policy_blocked==1, "true", \
    policy_blocked=="false" OR policy_blocked==0, "false", \
    isnotnull(policy_blocked), lower(policy_blocked), \
    1=1, null())

#-----------------------------------------------------------------------------
# Evaluation / TEVV / Drift
#-----------------------------------------------------------------------------
FIELDALIAS-genai_eval_score_value = evaluation_score_value AS gen_ai.evaluation.score.value
FIELDALIAS-genai_eval_score_label = evaluation_score_label AS gen_ai.evaluation.score.label
FIELDALIAS-genai_eval_explanation = evaluation_explanation AS gen_ai.evaluation.explanation
FIELDALIAS-genai_eval_name = evaluation_name AS gen_ai.evaluation.name
FIELDALIAS-genai_drift_metric_name = drift_metric_name AS gen_ai.drift.metric.name
FIELDALIAS-genai_drift_metric_value = drift_metric_value AS gen_ai.drift.metric.value
FIELDALIAS-genai_drift_status = drift_status AS gen_ai.drift.status

#-----------------------------------------------------------------------------
# Error and Infrastructure
#-----------------------------------------------------------------------------
FIELDALIAS-genai_error_type = error_type AS error.type
FIELDALIAS-genai_error_message = error_message AS error.message
FIELDALIAS-genai_status = status AS gen_ai.status
FIELDALIAS-genai_server_address = server_address AS server.address
FIELDALIAS-genai_server_port = server_port AS server.port

#-----------------------------------------------------------------------------
# Actor / Application Context
#-----------------------------------------------------------------------------
FIELDALIAS-genai_enduser = enduser_id AS enduser.id
FIELDALIAS-genai_service_name = service_name AS service.name
FIELDALIAS-genai_service_name_genai = service_name AS gen_ai.service.name
FIELDALIAS-genai_client_address = client_address AS client.address

# Derived: user ID with fallback
EVAL-gen_ai.user.id = coalesce(enduser_id, user_id, user)
# Derived: application name with fallback
EVAL-gen_ai.app.name = coalesce(service_name, app_name, app)

#-----------------------------------------------------------------------------
# CIM identity fields: user, app, src
#
# The ES Triage agent, Asset & Identity correlation and CIM-based searches look
# for user/app/src, not the gen_ai.* names, so without these an analyst search
# like `user=t.nguyen` finds none of the evidence. user and app repeat the
# coalesce() behind gen_ai.user.id / gen_ai.app.name rather than aliasing them:
# those two are calculated fields, aliases run before calculated fields
# (props.conf.spec: "You cannot alias a calculated field"), and EVALs run in
# parallel, so neither form can read the other's output. Repeating the
# expression keeps the CIM and gen_ai.* values identical by construction. src
# reads the client.address alias, which an EVAL can do.
#-----------------------------------------------------------------------------
EVAL-user = coalesce(enduser_id, user_id, user)
EVAL-app = coalesce(service_name, app_name, app)
EVAL-src = coalesce('client.address', src)

#-----------------------------------------------------------------------------
# Multi-value Field Extractions
#
# The five REPORT- extractions that used to live here (extract_safety_categories,
# extract_guardrail_ids, extract_pii_types, extract_finish_reasons,
# extract_stop_sequences) were removed in v1.6.2. Each set SOURCE_KEY to the bare
# field name, which KV_MODE = json never produces for a JSON array, so none of
# them ever fired. The braced-name EVALs above replace them and cover the scalar
# case as well, so there is nothing left for a REPORT to do here.
#-----------------------------------------------------------------------------

# Review status enrichment - auto-lookup review findings (DISABLED)
# Maps gen_ai.event.id to _key in KV store, outputs underscore fields as dotted namespace
# LOOKUP-gen_ai_review_enrichment = gen_ai_review_findings_lookup gen_ai.event.id AS _key OUTPUTNEW gen_ai_review_status AS gen_ai.review.status, gen_ai_review_status AS is_escalated, gen_ai_review_assignee AS gen_ai.review.assignee, gen_ai_review_reviewer AS gen_ai.review.reviewer, gen_ai_review_priority AS gen_ai.review.priority, gen_ai_review_pii_confirmed AS gen_ai.review.pii_confirmed, gen_ai_review_phi_confirmed AS gen_ai.review.phi_confirmed, gen_ai_review_pii_types AS gen_ai.review.pii_types, gen_ai_review_phi_types AS gen_ai.review.phi_types, gen_ai_review_prompt_injection_confirmed AS gen_ai.review.prompt_injection_confirmed, gen_ai_review_anomaly_prompt_detected AS gen_ai.review.anomaly_prompt_detected, gen_ai_review_anomaly_prompt_reviewed AS gen_ai.review.anomaly_prompt_reviewed, gen_ai_review_anomaly_response_detected AS gen_ai.review.anomaly_response_detected, gen_ai_review_anomaly_response_reviewed AS gen_ai.review.anomaly_response_reviewed, gen_ai_review_notes AS gen_ai.review.notes, gen_ai_review_updated_at AS gen_ai.review.updated_at

###############################################################################
# LEGACY INGEST SOURCETYPES (renamed onto the canonical sourcetype)
#
# Per props.conf.spec, data from a renamed sourcetype uses ONLY the target
# sourcetype's search-time configuration, so these stanzas intentionally carry
# nothing else. Consequences to be aware of:
#   - Search this data as sourcetype=gen_ai:json. The original name remains
#     available as _sourcetype (e.g. _sourcetype=medadvice3:json).
#   - "| tstats ... by sourcetype" and "| metadata type=sourcetypes" read
#     index-time metadata and still report the ORIGINAL name.
#   - Any site-local search-time config under the original stanza name is
#     discarded; move it into a [gen_ai:json] stanza in local/props.conf.
# Index-time settings are unaffected: data still arrives under the original
# sourcetype and is parsed under that name at index time.
###############################################################################

# =============================================================================
# Medadvice v3 format (flat JSON, gen_ai_log index)
# =============================================================================
[medadvice3:json]
rename = gen_ai:json

# =============================================================================
# ToyApp format (flat JSON, same schema as medadvice3)
# =============================================================================
[toyapp:json]
rename = gen_ai:json

###############################################################################
# SOURCETYPE-BASED NORMALIZATION (formats that do not fit the canonical schema)
###############################################################################

# =============================================================================
# GenAI Scoring pipeline output (written by | collect)
# Events are emitted with dotted gen_ai.* keys already in the JSON payload,
# so KV_MODE alone is sufficient - no aliasing required.
# =============================================================================
[genai_scoring]
KV_MODE = json
EVAL-source = genai_scoring_pipeline."_genai_scoring"

# =============================================================================
# DemoBot governance workflow sourcetypes (index=gen_ai_log, source=demobot:hec)
#
# DemoBot emits three shapes to gen_ai_log. Its inference telemetry arrives as
# the canonical sourcetype gen_ai:json and is normalized by that stanza above.
# The two below are session-audit and human-escalation records that accompany
# it and were previously unnormalized.
#
# These are deliberately NOT renamed onto gen_ai:json. They carry no provider,
# model, token, or cost fields, so renaming them would add them to the
# gen_ai_inference eventtype and contaminate every inference count, cost and
# token metric - the same failure mode the exclude_scoring_sourcetypes macro
# exists to prevent. Instead they normalize the shared identity keys
# (gen_ai.session.id, gen_ai.request.id, enduser.id) so they JOIN to the
# inference events, plus their own domain fields under gen_ai.audit.* and
# gen_ai.escalation.*.
#
# Neither stanza aliases gen_ai.provider.name; that is what keeps them out of
# [gen_ai_inference]. Do not add one.
# =============================================================================

# -----------------------------------------------------------------------------
# Session / user lifecycle audit records
# -----------------------------------------------------------------------------
[demobot:audit]
KV_MODE = json

# Correlation keys - join to gen_ai:json inference on session or request.
# mvdedup() is deliberate: DemoBot sent session_id and enduser_id as HEC
# indexed fields on events ingested before 2026-07-31, so on those the indexed
# value and the search-time JSON value both land and the key becomes a 2-value
# multivalue, which silently breaks join/dedup/stats-by. mvdedup collapses that
# and is a no-op on the current single-valued payload.
EVAL-gen_ai.event.id = mvdedup(audit_id)
EVAL-gen_ai.session.id = mvdedup(session_id)
EVAL-gen_ai.request.id = mvdedup(request_id)

# Actor context
EVAL-enduser.id = mvdedup(enduser_id)
EVAL-gen_ai.user.id = mvdedup(coalesce(enduser_id, user_id, user))
# CIM user/src, same expressions as gen_ai.user.id / client.address (see the
# CIM identity block in [gen_ai:json] for why these are not aliases).
EVAL-user = mvdedup(coalesce(enduser_id, user_id, user))
EVAL-src = coalesce(ip_address, 'details.client_address', src)

# Audit semantics
FIELDALIAS-demobot_audit_action = action AS gen_ai.audit.action
FIELDALIAS-demobot_audit_actor = actor AS gen_ai.audit.actor

# Client address: top-level ip_address, falling back to the nested details object
EVAL-client.address = coalesce(ip_address, 'details.client_address')

# Consent flag, normalized to the TA's lowercase "true"/"false" string convention
EVAL-gen_ai.audit.disclaimer_accepted = case( \
    'details.disclaimer_accepted'=="true" OR 'details.disclaimer_accepted'==1, "true", \
    'details.disclaimer_accepted'=="false" OR 'details.disclaimer_accepted'==0, "false", \
    isnotnull('details.disclaimer_accepted'), lower('details.disclaimer_accepted'), \
    1=1, null())

# -----------------------------------------------------------------------------
# Human-review escalation records
# -----------------------------------------------------------------------------
[demobot:escalation]
KV_MODE = json

# Correlation keys - join to gen_ai:json inference on session or request.
# mvdedup() for the same reason as [demobot:audit] above: pre-2026-07-31 events
# carry session_id / enduser_id as HEC indexed fields as well as in the JSON
# body, which would otherwise yield a 2-value join key.
EVAL-gen_ai.event.id = mvdedup(escalation_id)
EVAL-gen_ai.session.id = mvdedup(session_id)
EVAL-gen_ai.request.id = mvdedup(request_id)

# Actor context
EVAL-enduser.id = mvdedup(enduser_id)
EVAL-gen_ai.user.id = mvdedup(coalesce(enduser_id, user_id, user))
# CIM user, same expression as gen_ai.user.id (see [gen_ai:json]).
EVAL-user = mvdedup(coalesce(enduser_id, user_id, user))

# Escalation semantics. Two-step *_raw pattern per the boolean convention above:
# alias the source to a _raw name, then compute the canonical field from the
# underscore source, so no EVAL reads and rewrites its own output field.
FIELDALIAS-demobot_esc_reason = reason AS gen_ai.escalation.reason
FIELDALIAS-demobot_esc_severity_raw = severity AS gen_ai.escalation.severity_raw
EVAL-gen_ai.escalation.severity = if(isnotnull(severity), lower(severity), null())

# Human review workflow - same gen_ai.review.* namespace the review-queue
# KV store enrichment populates, so escalations and review findings line up.
FIELDALIAS-demobot_esc_review_status = review_status AS gen_ai.review.status
FIELDALIAS-demobot_esc_reviewer = reviewer_id AS gen_ai.review.reviewer
FIELDALIAS-demobot_esc_review_notes = review_notes AS gen_ai.review.notes
FIELDALIAS-demobot_esc_review_updated = review_timestamp AS gen_ai.review.updated_at

# Escalated conversation, kept under gen_ai.escalation.*.
# Deliberately NOT mapped onto gen_ai.input.messages / gen_ai.output.messages:
# the same turns already carry those fields on the corresponding gen_ai:json
# inference events. Duplicating them here would double-count in content-based
# detections and copy prompt/response content (PII/PHI) into a second namespace.
#
# These three sources are JSON arrays, so they must stay MULTIVALUE. They use
# EVAL rather than FIELDALIAS deliberately: multivalue behaviour through a field
# alias is not something the field-alias documentation defines either way, and
# this TA ships to Splunk 9.0+ and Splunk Cloud where relying on undocumented
# behaviour is not safe. An eval assignment preserves multivalue by definition.
# Do not "simplify" these back into FIELDALIAS.
EVAL-gen_ai.escalation.roles = 'conversation_history{}.role'
EVAL-gen_ai.escalation.messages = 'conversation_history{}.content'
EVAL-gen_ai.escalation.symptoms = 'symptoms{}'

###############################################################################
# Medadvice v2 format (ai_log2 index - nested event structure)
#
# Distinct nested event.* schema on a different index; cannot be renamed onto
# gen_ai:json and therefore keeps its own mapping.
###############################################################################

# =============================================================================
# Medadvice v2 format (nested event structure)
# =============================================================================
[medadvice:json]
KV_MODE = json
# Note: Index-time settings removed for search-time TA compatibility

# Core operation / model identity (nested event fields)
FIELDALIAS-genai_provider = event.model_provider AS gen_ai.provider.name
FIELDALIAS-genai_model_request = event.model_id AS gen_ai.request.model
FIELDALIAS-genai_response_id = event.inference_id AS gen_ai.response.id
FIELDALIAS-genai_request_id = event.inference_id AS gen_ai.request.id
FIELDALIAS-genai_session = event.session_id AS gen_ai.session.id
FIELDALIAS-genai_event_id = event.event_id AS gen_ai.event.id
FIELDALIAS-genai_trace = event.trace_id AS trace_id

# Input/output payload
FIELDALIAS-genai_input = event.input AS gen_ai.input.messages
FIELDALIAS-genai_output = event.output AS gen_ai.output.messages

# Request parameters
FIELDALIAS-genai_max_tokens = event.max_tokens AS gen_ai.request.max_tokens
FIELDALIAS-genai_temperature = event.temperature AS gen_ai.request.temperature
FIELDALIAS-genai_top_p = event.top_p AS gen_ai.request.top_p

# Usage, performance, cost
FIELDALIAS-genai_input_tokens = event.input_size_tokens AS gen_ai.usage.input_tokens
FIELDALIAS-genai_output_tokens = event.output_size_tokens AS gen_ai.usage.output_tokens
FIELDALIAS-genai_cost = event.cost AS gen_ai.cost.total
EVAL-gen_ai.usage.total_tokens = coalesce('gen_ai.usage.input_tokens', 0) + coalesce('gen_ai.usage.output_tokens', 0)
EVAL-gen_ai.client.operation.duration = if(isnotnull('event.latency_ms'), 'event.latency_ms'/1000, null())

# Safety, guardrails, policy
FIELDALIAS-genai_safety_score = event.safety_score AS gen_ai.safety.score
FIELDALIAS-genai_safety_violated = event.safety_violated AS gen_ai.safety.violated
FIELDALIAS-genai_guardrail_triggered = event.guardrails_triggered AS gen_ai.guardrail.triggered
FIELDALIAS-genai_pii_detected = event.pii_detected AS gen_ai.pii.detected

# Normalize booleans to consistent "true"/"false" strings
EVAL-gen_ai.safety.violated = if('gen_ai.safety.violated'=="true" OR 'gen_ai.safety.violated'==1 OR 'gen_ai.safety.violated'==true, "true", if('gen_ai.safety.violated'=="false" OR 'gen_ai.safety.violated'==0 OR 'gen_ai.safety.violated'==false, "false", null()))
EVAL-gen_ai.guardrail.triggered = if('gen_ai.guardrail.triggered'=="true" OR 'gen_ai.guardrail.triggered'==1 OR 'gen_ai.guardrail.triggered'==true, "true", if('gen_ai.guardrail.triggered'=="false" OR 'gen_ai.guardrail.triggered'==0 OR 'gen_ai.guardrail.triggered'==false, "false", null()))
EVAL-gen_ai.pii.detected = if('gen_ai.pii.detected'=="true" OR 'gen_ai.pii.detected'==1 OR 'gen_ai.pii.detected'==true, "true", if('gen_ai.pii.detected'=="false" OR 'gen_ai.pii.detected'==0 OR 'gen_ai.pii.detected'==false, "false", null()))

# Error and infra
FIELDALIAS-genai_status = event.status AS gen_ai.status
FIELDALIAS-genai_error_message = event.error_message AS error.message

# Actor / application context
FIELDALIAS-genai_service_name = event.app AS service.name
FIELDALIAS-genai_service_name_normalized = event.app AS gen_ai.service.name
EVAL-gen_ai.app.name = coalesce('service.name', 'event.app')
# CIM app, same expression as gen_ai.app.name (see [gen_ai:json]).
EVAL-app = coalesce('service.name', 'event.app')

# Multi-value field extraction.
# event.guardrails_triggered is a JSON array, so KV_MODE = json names it
# 'event.guardrails_triggered{}'. The extract_guardrail_ids_alt REPORT this
# replaces keyed off the bare name and never fired. See the multi-value note in
# the [gen_ai:json] stanza.
EVAL-gen_ai.guardrail.ids = case( \
    isnotnull('event.guardrails_triggered{}'), 'event.guardrails_triggered{}', \
    isnotnull('event.guardrails_triggered'), 'event.guardrails_triggered', \
    1=1, null())

# Review status enrichment - auto-lookup review findings (DISABLED)
# Maps gen_ai.event.id to _key in KV store, outputs underscore fields as dotted namespace
# LOOKUP-gen_ai_review_enrichment = gen_ai_review_findings_lookup gen_ai.event.id AS _key OUTPUTNEW gen_ai_review_status AS gen_ai.review.status, gen_ai_review_status AS is_escalated, gen_ai_review_assignee AS gen_ai.review.assignee, gen_ai_review_reviewer AS gen_ai.review.reviewer, gen_ai_review_priority AS gen_ai.review.priority, gen_ai_review_pii_confirmed AS gen_ai.review.pii_confirmed, gen_ai_review_phi_confirmed AS gen_ai.review.phi_confirmed, gen_ai_review_prompt_injection_confirmed AS gen_ai.review.prompt_injection_confirmed, gen_ai_review_anomaly_prompt_detected AS gen_ai.review.anomaly_prompt_detected, gen_ai_review_anomaly_prompt_reviewed AS gen_ai.review.anomaly_prompt_reviewed, gen_ai_review_anomaly_response_detected AS gen_ai.review.anomaly_response_detected, gen_ai_review_anomaly_response_reviewed AS gen_ai.review.anomaly_response_reviewed

###############################################################################
# Fallback source-based stanzas (for other configurations)
# Note: KV_MODE=json enables search-time JSON parsing.
# CAUTION: source:: stanzas outrank <sourcetype> stanzas (props.conf.spec).
# Keep these limited to KV_MODE so they cannot override [gen_ai:json] mappings.
###############################################################################

[source::*/gen_ai_log/*]
KV_MODE = json

[source::*/ai_log2/*]
KV_MODE = json
