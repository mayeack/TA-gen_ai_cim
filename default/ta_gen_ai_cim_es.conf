###############################################################################
# ta_gen_ai_cim_es.conf
# App: TA-gen_ai_cim
# Purpose: Splunk Enterprise Security integration settings read by the
#          `| genaiseedes` command (run by the shipped search "GenAI - ES -
#          Seed Response Plan and SOAR Binding").
# Compatible with: Splunk Enterprise 9.0+, Splunk Cloud
###############################################################################

###############################################################################
# ES INTEGRATION
###############################################################################
[es_integration]
# Seed the AI Incident Response Plan, the "ai security incident" investigation
# type bound to it and the AI Findings queue into Mission Control. Idempotent;
# only TA-owned records are written.
seed_response_plan = true

# Reach the paired SOAR through Mission Control's own pairing proxy to bind the
# plan's Containment tasks to the simulated "MedAdvice Identity Provider"
# actions (disable user, clear user sessions). Nothing is written to SOAR unless
# that app is installed there; then only its `medadvice_idp` asset is created.
bind_soar_actions = true

# Install the simulator app on SOAR when it is missing. Needs a `soar` account
# in ta_gen_ai_cim_account.conf (url + a SOAR automation token stored as the
# account password) because the ES proxy has no app-install route. Off by
# default: a demo identity provider must never appear on a customer's SOAR by
# surprise.
install_simulator = false

# Turn on ES AI triage (ai_triage_enabled) and allowlist the primary detection.
# A no-op without the entitlement (allow_ai_triage). Off by default because it
# changes ES-wide behaviour, not just this TA's records.
enable_triage_agent = false
