#
# web.conf - Web server configuration
# TA-gen_ai_cim
#
# Exposes the app's account REST handler (restmap.conf
# [admin:ta_gen_ai_cim_account]) to Splunk Web's /splunkd/__raw proxy, which
# forwards only exposed patterns; the Configuration page's Cisco Duo tab saves
# through it. Splunk Cloud only allows narrowly scoped keys here; [expose:*]
# stanzas are permitted. Splunk Web reads them at startup, so a change takes
# effect after a Splunk Web restart.
#
# Compatible with: Splunk Enterprise 9.0+, Splunk Cloud
#

###############################################################################
# ACCOUNT REST HANDLER (ta_gen_ai_cim_account/ta_gen_ai_cim_account)
# Up to v1.8.0 the only stanza was [expose:ta_gen_ai_cim] with pattern
# TA-gen_ai_cim/*, which matched no endpoint the app serves (Splunk Web anchors
# a pattern under services/ or servicesNS/<owner>/<app>/).
###############################################################################

[expose:ta_gen_ai_cim_account]
pattern = ta_gen_ai_cim_account/ta_gen_ai_cim_account
methods = GET, POST

[expose:ta_gen_ai_cim_account_specified]
pattern = ta_gen_ai_cim_account/ta_gen_ai_cim_account/*
methods = GET, POST, DELETE
