#
# inputs.conf - Data inputs and ES Asset & Identity sources
# TA-gen_ai_cim
#
# Registers the TA's identity/asset lookups with the ES identity manager and
# declares the defaults of the ta_gen_ai_cim_duo modular input scheme
# (entry point bin/ta_gen_ai_cim_duo.py, logic in bin/ta_gen_ai_cim_duo_input.py,
# spec in README/inputs.conf.spec).
#
# Everything new here ships OFF: there is no ta_gen_ai_cim_duo:// instance in
# default/ (only the scheme's default stanza below), and the Duo identity
# source does not ship; add it in local/ (a commented example is below). Each
# environment adds its instances and enablement in local/.
#
# An identity or asset source that ships here must ship its lookup file too
# (R-INP-002): the ES identity manager checks every source's file, a disabled
# source's included.
#
# Compatible with: Splunk Enterprise 9.0+, Splunk Cloud
#

###############################################################################
# ES ASSET & IDENTITY FRAMEWORK SOURCE REGISTRATION
# Registers the MedAdvice CSV lookups as identity/asset sources so the ES
# merge process folds them into identity_lookup_expanded / asset_lookup_by_str.
###############################################################################

[identity_manager://medadvice_identities]
target = identity
url = lookup://medadvice_identities
category = MedAdvice GenAI users
description = Identities observed in MedAdvice GenAI traffic (index=gen_ai_log)
disabled = false

[identity_manager://medadvice_assets]
target = asset
url = lookup://medadvice_assets
category = MedAdvice GenAI assets
description = Source IPs / hosts observed in MedAdvice GenAI traffic
disabled = false

# AI Trust Lab 5 persona identities (v1.8.0). Ships DISABLED: on a product
# install the lab personas must never merge into the customer's identities.
# tools/show_postdeploy.py --lab5 enables it on a room stack and
# --lab5-teardown disables it again.
[identity_manager://pseudoco_identity_personas]
target = identity
url = lookup://pseudoco_identity_personas
category = PseudoCo Lab 5 personas
description = AI Trust Lab 5 Duo personas (trusted and victim) used by PseudoCo Assistant
disabled = true

# Cisco Duo users (v1.9.0). This identity source does NOT ship: default/ holds
# no stanza for it, only the commented example below. Its lookup file is
# written by the "GenAI - Identity - Duo Identity Lookup Gen" search (ships
# disabled) from the newest complete users snapshot of a ta_gen_ai_cim_duo
# input, and is never shipped. The ES identity manager (SA-IdentityManagement,
# every 300 s) checks the lookup file of EVERY identity_manager source, a
# disabled one included, and while that file is missing it logs
# "ERROR PersistentScript ... Lookup table was not found" to splunkd.log every
# 5 minutes. A stanza shipped here, even disabled, would log that error for
# as long as the install never turns Duo on.
#
# Add the source only where that input and search run, and only once the file
# has rows: wait until the users input has written a complete snapshot, run
# the lookup gen once by hand, and add the source when
# "| inputlookup ta_gen_ai_cim_duo_identities | stats count" returns more
# than 0. ES merges every enabled identity source in one search with no check
# that a file exists, so a missing file fails that search for EVERY source.
# Do not add it where genai_duo_identity_scope leaves no rows (for example a
# room stack that polls only the lab tenant). Either copy the example into
# local/inputs.conf without the leading "#" and indentation (Splunk reads it
# after a restart or an inputs reload), or add it in Enterprise Security
# (README, "Turning it on"). Where Duo usernames are emails, also set
# dynamic_identity_spec = {"email_short": true} on the stanza: ES then adds
# each email's local part as an identity key, which is the Duo rule's risk
# object when the username is that email.
#
#   [identity_manager://ta_gen_ai_cim_duo_identities]
#   target = identity
#   url = lookup://ta_gen_ai_cim_duo_identities
#   category = Cisco Duo users
#   description = Cisco Duo users from the Duo Admin API users snapshot (ta_gen_ai_cim:duo:user)
#   disabled = false

###############################################################################
# CISCO DUO MODULAR INPUT - SCHEME DEFAULTS (v1.9.0)
# Defaults for every ta_gen_ai_cim_duo://<name> instance. No instance ships:
# an owner adds one per endpoint in local/inputs.conf, e.g.
#
#   [ta_gen_ai_cim_duo://duo_authentication]
#   account = duo
#   endpoint = authentication
#   index = duo
#   interval = 300
#
# account names a ta_gen_ai_cim_account stanza with auth_type = duo_hmac
# (secret key in storage/passwords). Keep interval at 120 s or more for the
# log endpoints and use 86400 for users. Run it on one standalone search head
# or heavy forwarder; on a search head cluster only the captain polls (best
# effort, untested). Never point index at gen_ai_log.
###############################################################################

[ta_gen_ai_cim_duo]
python.version = python3
python.required = 3.13
interval = 300
lag_seconds = 180
initial_lookback_hours = 24
