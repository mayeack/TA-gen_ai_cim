###############################################################################
# PULL FULL SERVICENOW AI INVENTORY
# Alert action to pull all records from ServiceNow AI System and AI Model
# tables into KV stores for complete "Inventoried Not Detected" reporting
###############################################################################

[pull_snow_inventory]
is_custom = 1
label = Pull Full ServiceNow AI Inventory
description = Pulls all AI System and AI Model records from ServiceNow into KV stores for complete asset discovery

icon_path = servicenow.png

payload_format = json
forceCsvResults = auto

alert.execute.cmd = pull_snow_inventory.py
python.version = python3
python.required = 3.13

track_alert = 1
maxresults = 1
maxtime = 10m

param._cam = {"supports_adhoc":true,"supports_savedreport":true}

###############################################################################
# AI DEFENSE RESPONSE ACTIONS
#
# Simulated containment steps for GenAI incidents. Each action records a
# structured audit event in gen_ai_log (sourcetype ai_cim:response:action)
# carrying "simulated": true, and reports success. Nothing is called
# externally - no IdP, no token service, no Cisco AI Defense policy API.
#
# They exist so an analyst working a finding, or a Containment task in the
# AI Incident Response Plan, gets a real adaptive-response entry and an audit
# trail on a deployment with no paired SOAR instance. Replace them with real
# SOAR playbook actions once a SOAR instance is paired.
#
# Shared logic lives in bin/ai_defense_response.py; the three scripts below
# are thin wrappers over it.
###############################################################################

# ============================================================================
# SUSPEND USER
# Acts on the identity that triggered the AI Defense policy block.
# ============================================================================

[ai_defense_suspend_user]
is_custom = 1
label = Suspend User (AI Defense)
description = Records a simulated account suspension for the identity behind a Cisco AI Defense prompt injection block

payload_format = json
forceCsvResults = auto

alert.execute.cmd = ai_defense_suspend_user.py
python.version = python3
python.required = 3.13

track_alert = 1
maxresults = 100
maxtime = 5m

param._cam = {"supports_adhoc":true,"supports_savedreport":true}

# Optional override. Left empty, the action resolves the identity from the
# triggering result (enduser_id / gen_ai.user.id / user / risk_object).
param.enduser_id =

# ============================================================================
# REVOKE SESSION / API KEY
# Acts on the GenAI session that carried the blocked prompts.
# ============================================================================

[ai_defense_revoke_session]
is_custom = 1
label = Revoke Session / API Key
description = Records a simulated session revocation and API key rotation for a GenAI session flagged by Cisco AI Defense

payload_format = json
forceCsvResults = auto

alert.execute.cmd = ai_defense_revoke_session.py
python.version = python3
python.required = 3.13

track_alert = 1
maxresults = 100
maxtime = 5m

param._cam = {"supports_adhoc":true,"supports_savedreport":true}

# Optional override. Left empty, the action resolves the session from the
# triggering result (session_id / gen_ai.session.id / conversation_id).
param.session_id =

# ============================================================================
# TIGHTEN GUARDRAIL POLICY
# Acts on the GenAI application that was targeted.
# ============================================================================

[ai_defense_tighten_guardrail]
is_custom = 1
label = Tighten Guardrail Policy
description = Records a simulated tightening of the Cisco AI Defense guardrail profile for the targeted GenAI application

payload_format = json
forceCsvResults = auto

alert.execute.cmd = ai_defense_tighten_guardrail.py
python.version = python3
python.required = 3.13

track_alert = 1
maxresults = 100
maxtime = 5m

param._cam = {"supports_adhoc":true,"supports_savedreport":true}

# Optional override. Left empty, the action resolves the application from the
# triggering result (app_name / gen_ai.app.name / app / service_name).
param.app_name =
